name: Schedule probe

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record trigger details
        shell: bash
        env:
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          printf 'event=%s\ncron=%s\nref=%s\nsha=%s\nactor=%s\n' \
            "$GITHUB_EVENT_NAME" "$CRON_EXPRESSION" "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_ACTOR" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ' | tee -a "$GITHUB_STEP_SUMMARY"
